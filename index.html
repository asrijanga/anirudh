<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>System Anirudh</title>
    <meta name="description" content="Anirudh, rendered as a planetary system. Seattle, Slack, trains, gardens and a lot of solar systems." />
    <meta name="theme-color" content="#05060f" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="scene" aria-label="An interactive 3D planetary system representing Anirudh"></canvas>

    <header class="title" id="title">
      <p class="eyebrow">you are entering</p>
      <h1>System&nbsp;<span>Anirudh</span></h1>
      <p class="subtitle">One star. A handful of worlds. Each one a part of the story.</p>
    </header>

    <div class="nowebgl" id="nowebgl" hidden>
      <h2>This system needs WebGL to come online.</h2>
      <p>Try a recent version of Chrome, Firefox, Safari or Edge.</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
